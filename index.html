<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPPI - Sua conversa. Seu mundo.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #172b55;
       }
        /* FUNDO DA PAGINA PAPPI */
    .pagina {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .forma-azul {
      position: absolute;
      width: 230px;
      height: 230px;
      background: #1769e8;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
    }

    .forma-superior {
      top: -130px;
      right: -100px;
    }

    .forma-inferior {
      bottom: -140px;
      left: -100px;
    }
      /* IDENTIDADE VISUAL PAPPI */

    .conteudo-principal {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* LOGOTIPO PAPPI */

    .logo-pappi {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

        .simbolo-pappi {
      width: 150px;
      height: 115px;
      background: #ffffff;
      border: 9px solid #0875ed;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .simbolo-pappi::after {
      content: "";
      position: absolute;
      bottom: -17px;
      left: 10px;
      width: 25px;
      height: 25px;
      background: #ffffff;
      border-left: 8px solid #0875ed;
      border-bottom: 8px solid #0875ed;
      transform: skew(-25deg) rotate(-15deg);
    }

        .ponto-logo {
      width: 15px;
      height: 15px;
      background: #0875ed;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    
    /* NOME DA MARCA */

    .nome-pappi {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
    }

    .nome-azul {
      color: #172b55;
    }

    .nome-claro {
      color: #0875ed;
    }

    .slogan-pappi {
      font-size: 14px;
      color: #64748b;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* AREA DOS BOTOES */

    .area-botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 38px;
    }

    .botao-entrar {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #1769e8;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-cadastrar {
      width: 100%;
      height: 54px;
      border: 2px solid #1769e8;
      border-radius: 14px;
      background: #ffffff;
      color: #1769e8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="pagina">

  <div class="forma-azul forma-superior"></div>

  <div class="forma-azul forma-inferior"></div>
  <div class="conteudo-principal">

    <div class="logo-pappi">

      <div class="simbolo-pappi">
        <span class="ponto-logo"></span>
        <span class="ponto-logo"></span>
        <span class="ponto-logo"></span>
      </div>

      <div class="nome-pappi">
  <span class="nome-azul">PAP</span><span class="nome-claro">PI</span>
</div>

    </div>

    <div class="slogan-pappi">
      Sua conversa. Seu mundo.
    </div>
    <div class="area-botoes">

      <button class="botao-entrar">
        Entrar
      </button>

      <button class="botao-cadastrar">
        Criar minha conta
      </button>

    </div>
  </div>
</div>
</body>
</html>
