<script>
const SUPABASE_URL = "https://fvltrubujyvkbzijbobq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hXx1ZShKPY6iUiXtGJ9rUQ_HbuYGhQ2";
if(!window.supabase||!window.supabase.createClient){
 document.getElementById("app").innerHTML='<div style="padding:30px;text-align:center;color:#172b55">Não foi possível carregar o sistema PAPPI. Verifique a conexão e atualize a página.</div>';
 throw new Error("Biblioteca Supabase não carregada");

const cliente = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const URL_PAPPI = "https://alexiashoploja1-criador.github.io/pappi/";
const app = document.getElementById("app");

let telaAtual = "";
let usuarioAtual = null;
let fotoSelecionada = null;

const logo = `
<svg class="simbolo" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="azulPappi" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0875ed"/><stop offset="100%" stop-color="#172b8c"/>
</linearGradient></defs>
<path d="M105 25 C55 25 25 55 25 105 V150 C25 190 45 215 80 230 L65 285 L135 245 H255 C300 245 335 215 335 170 V100 C335 55 305 25 260 25 Z" fill="#fff" stroke="url(#azulPappi)" stroke-width="25" stroke-linejoin="round"/>
<circle cx="125" cy="145" r="23" fill="url(#azulPappi)"/>
<circle cx="180" cy="145" r="23" fill="url(#azulPappi)"/>
<circle cx="235" cy="145" r="23" fill="url(#azulPappi)"/>
</svg>`;

function mostrarEntrada(mensagemTexto="",cadastro=false){
 telaAtual="entrada";
 app.innerHTML=`
 <main class="pagina">
 <div class="forma a"></div><div class="forma b"></div>
 <section class="cartao">
 <div class="logo">${logo}
 <div class="nome-marca"><span class="azul">PAP</span><span class="marinho">PI</span></div>
 <div class="slogan">Sua conversa. Seu mundo.</div></div>
 <h1>${cadastro?"Crie sua conta":"Entre no PAPPI"}</h1>
 <p class="descricao">${cadastro?"Informe seu e-mail. Enviaremos um link para confirmar seu acesso.":"Sua conexão com pessoas, grupos e comunidades em um só lugar."}</p>
 <input class="campo" id="email" type="email" placeholder="Digite seu e-mail" autocomplete="email">
 ${cadastro?"":'<input class="campo" id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">'}
 <button class="botao" id="acao">${cadastro?"Enviar link de confirmação →":"Entrar →"}</button>
 ${cadastro?"":'<button class="link" id="recuperar">Esqueci minha senha</button>'}
 <button class="link" id="alternar">${cadastro?"Já tem conta? Entrar":"Ainda não tem conta? Criar conta"}</button>
 <p class="mensagem" id="mensagem">${mensagemTexto}</p>
 <p class="legal">Ao continuar, você concorda com nossos Termos de Uso e Política de Privacidade.</p>
 </section></main>`;
 document.getElementById("alternar").onclick=()=>mostrarEntrada("",!cadastro);
 document.getElementById("acao").onclick=()=>cadastro?enviarLink():entrar();
 const recuperar=document.getElementById("recuperar");
 if(recuperar)recuperar.onclick=recuperarSenha;
}

async function recuperarSenha(){
 const email=document.getElementById("email").value.trim();
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("recuperar");

 if(!email){
  msg.textContent="Digite seu e-mail para recuperar a senha.";
  return;
 }

 btn.disabled=true;
 msg.textContent="Enviando link de recuperação...";

 const {error}=await cliente.auth.resetPasswordForEmail(email,{
  redirectTo:URL_PAPPI
 });

 btn.disabled=false;

 if(error){
  msg.textContent="Não foi possível enviar o link. Tente novamente.";
 }else{
  msg.textContent="Se o e-mail estiver cadastrado, enviaremos um link para redefinir sua senha. Verifique também o Spam.";
 }
} 
 function mensagemPerfil(txt,erro=false){
 const el=document.getElementById("mensagemPerfil");
 if(el){el.textContent=txt;el.style.color=erro?"#c0392b":"#0875ed";}
}

async function enviarLink(){
 const email=document.getElementById("email").value.trim();
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("acao");
 if(!email){msg.textContent="Digite seu e-mail.";return;}
 btn.disabled=true;btn.textContent="Enviando...";
 const {error}=await cliente.auth.signInWithOtp({
  email,
  options:{emailRedirectTo:URL_PAPPI,shouldCreateUser:true}
 });
 btn.disabled=false;btn.textContent="Enviar link de confirmação →";
 msg.textContent=error?"Não foi possível enviar: "+error.message:"Enviamos um link para seu e-mail. Abra a mensagem para continuar o cadastro.";
}

async function entrar(){
 const email=document.getElementById("email").value.trim();
 const senha=document.getElementById("senha").value;
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("acao");
 if(!email||!senha){msg.textContent="Informe seu e-mail e sua senha.";return;}
 btn.disabled=true;btn.textContent="Entrando...";
 const {data,error}=await cliente.auth.signInWithPassword({email,password:senha});
 btn.disabled=false;btn.textContent="Entrar →";
 if(error){msg.textContent="Não foi possível entrar: "+error.message;return;}
 await direcionarUsuario(data.user);
}

let intervaloPresencaPappi=null;

async function atualizarPresencaPappi(){
 if(!usuarioAtual)return;

 const {error}=await cliente
  .from("user_presence")
  .upsert({
   user_id:usuarioAtual.id,
   last_seen:new Date().toISOString()
  },{onConflict:"user_id"});

 if(error)console.error("PAPPI presença:",error);
}
let canalPresencaPappi=null;

async function marcarMensagensEntregues(destinatarioId){
 if(!usuarioAtual)return;

 const consulta=cliente
  .from("messages")
  .update({delivered_at:new Date().toISOString()});

 if(destinatarioId){
  const {data:participacoes,error}=await cliente
   .from("conversation_members")
   .select("conversation_id")
   .eq("user_id",destinatarioId);

  if(error||!participacoes?.length)return;

  const conversas=participacoes.map(item=>item.conversation_id);

  const {error:erroEntrega}=await consulta
   .in("conversation_id",conversas)
   .eq("sender_id",usuarioAtual.id)
   .is("delivered_at",null)
   .neq("content","PAPPI_DELETED");

  if(erroEntrega)console.error("PAPPI entrega:",erroEntrega);
  return;
 }

 const {data:participacoes,error}=await cliente
  .from("conversation_members")
  .select("conversation_id")
  .eq("user_id",usuarioAtual.id);

 if(error||!participacoes?.length)return;

 const conversas=participacoes.map(item=>item.conversation_id);

 const {error:erroEntrega}=await cliente
  .from("messages")
  .update({delivered_at:new Date().toISOString()})
  .in("conversation_id",conversas)
  .neq("sender_id",usuarioAtual.id)
  .is("delivered_at",null)
  .neq("content","PAPPI_DELETED");

 if(erroEntrega)console.error("PAPPI entrega:",erroEntrega);
}

async function verificarPresencasAtivasPappi(){
 await marcarMensagensEntregues();
}

function observarPresencaPappi(){
 if(canalPresencaPappi){
  cliente.removeChannel(canalPresencaPappi);
 }

 canalPresencaPappi=cliente
  .channel("presenca-global-"+usuarioAtual.id)
  .on("postgres_changes",{
   event:"*",
   schema:"public",
   table:"user_presence"
  },payload=>{
   const pessoa=payload.new;
   if(!pessoa?.user_id||!pessoa.last_seen)return;

   const online=Date.now()-new Date(pessoa.last_seen).getTime()<45000;

   if(online)marcarMensagensEntregues(pessoa.user_id);
  })
  .subscribe();
}
function iniciarPresencaPappi(){
 if(intervaloPresencaPappi)clearInterval(intervaloPresencaPappi);

 atualizarPresencaPappi();
 observarPresencaPappi();
 verificarPresencasAtivasPappi();
setInterval(verificarPresencasAtivasPappi,5000);
 intervaloPresencaPappi=setInterval(atualizarPresencaPappi,20000);

 document.removeEventListener("visibilitychange",atualizarPresencaPappi);
 document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")atualizarPresencaPappi();
 });
 
}

async function direcionarUsuario(usuario){
 if(!usuario)return;
 usuarioAtual=usuario;
 iniciarPresencaPappi();

 const {data,error}=await cliente.from("profiles").select("*").eq("user_id",usuario.id).maybeSingle();

 if(error){
  mostrarEntrada("Não foi possível consultar seu perfil: "+error.message);
  return;
 }

 if(data){abrirTelaPrincipal(usuario,data);}
 else{mostrarCompletarPerfil(usuario);}
}

function mostrarCompletarPerfil(usuario){
 telaAtual="perfil";
 fotoSelecionada=null;
 app.innerHTML=`
 <main class="pagina"><section class="cartao">
 <div class="logo">${logo}
 <div class="nome-marca"><span class="azul">PAP</span><span class="marinho">PI</span></div>
 <div class="slogan">Sua conversa. Seu mundo.</div></div>
 <h1>Complete seu perfil</h1>
 <p class="descricao">Agora escolha sua foto, seu nome, seu usuário e sua senha.</p>
 <div class="foto-area">
 <img id="fotoPreview" class="foto-preview" src="https://placehold.co/120x120/eaf1fb/0875ed?text=Foto" alt="Prévia da foto">
 <label class="foto-label" for="foto">Adicionar foto (opcional)</label>

 <input class="campo" id="nomeCompleto" placeholder="Seu nome" autocomplete="name">

<input class="campo" id="senhaNova" type="password" placeholder="Crie sua nova senha (mínimo 6 caracteres)" autocomplete="new-password">
 <input class="campo" id="senhaConfirmar" type="password" placeholder="Confirme sua senha" autocomplete="new-password">
 <button class="botao" id="salvarPerfil">Salvar e entrar →</button>
 <p class="mensagem" id="mensagemPerfil"></p>
 </section></main>`;
 document.getElementById("foto").onchange=evento=>{
  const arquivo=evento.target.files[0];
  if(!arquivo)return;
  if(!["image/jpeg","image/png","image/webp"].includes(arquivo.type)){
   mensagemPerfil("Use uma imagem JPG, PNG ou WEBP.",true);return;
  }
  if(arquivo.size>2*1024*1024){
   mensagemPerfil("A foto deve ter no máximo 2 MB.",true);return;
  }
  fotoSelecionada=arquivo;
  document.getElementById("fotoPreview").src=URL.createObjectURL(arquivo);
 };
 document.getElementById("salvarPerfil").onclick=salvarPerfil;
}

async function salvarPerfil(){
 const nome=document.getElementById("nomeCompleto").value.trim();
 const username=document.getElementById("username").value.trim().toLowerCase();
 const senha=document.getElementById("senhaNova").value;
 const confirmar=document.getElementById("senhaConfirmar").value;
 const senhaAtual=document.getElementById("senhaAtual").value;
 const btn=document.getElementById("salvarPerfil");
 if(nome.length<2){mensagemPerfil("Informe seu nome completo.",true);return;}
 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  mensagemPerfil("O usuário deve ter de 3 a 20 caracteres: letras sem acento, números ou _.",true);return;
 }
 if(senha.length<6){mensagemPerfil("A senha precisa ter pelo menos 6 caracteres.",true);return;}
 if(senha!==confirmar){mensagemPerfil("As senhas não são iguais.",true);return;}
 btn.disabled=true;btn.textContent="Salvando...";
 let avatarUrl=null;
 try{
  const {data:authData,error:authError}=await cliente.auth.updateUser({
  password:senha,
  current_password:senhaAtual,
  data:{nome:nome,username:username}
});
  if(authError)throw authError;
  const usuario=authData.user||usuarioAtual;
  if(fotoSelecionada){
   const extensao=fotoSelecionada.type==="image/png"?"png":fotoSelecionada.type==="image/webp"?"webp":"jpg";
   const caminho=usuario.id+"/"+Date.now()+"."+extensao;

  .in("conversation_id",ids)
  .neq("user_id",usuarioAtual.id);

 if(erroMembros){
  alert("Não foi possível localizar os contatos.");
  return;
 }

 const destinos=[...new Map(
  (membros||[])
   .filter(item=>item.conversation_id!==conversaId)

 )];

 if(destinos.length===0){
  alert("Você ainda não tem outra conversa para encaminhar.");
  return;
 }

 const usuarios=[...new Set(destinos.map(item=>item[1]))];

 const {data:perfis,error:erroPerfis}=await cliente
  .from("profiles")
  .select("user_id,full_name,username")
  .in("user_id",usuarios);

 if(erroPerfis){
  alert("Não foi possível carregar os contatos.");
  return;
 }

      ?"PAPPI_IMG:"
      :conteudoOriginal.startsWith("PAPPI_AUDIO:")
      ?"PAPPI_AUDIO:"

      .from("messages")
      .insert({

 });

  let gravadorAudio=null;
let partesAudio=[];
let fluxoAudio=null;
let cancelarGravacaoAudio=false;

const botaoAudio=document.getElementById("gravarAudio");
const botaoCancelarAudio=document.getElementById("cancelarAudio");
const indicadorAudio=document.getElementById("indicadorAudio");
const campoTexto=document.getElementById("textoMensagem");
const botaoAnexos=document.getElementById("abrirAnexos");
let contextoVisualAudio=null;
let quadroOndaAudio=null;
async function iniciarOndaAudio(){
 try{
  const AudioContexto=window.AudioContext||window.webkitAudioContext;
  if(!AudioContexto)return;

  contextoVisualAudio=new AudioContexto();
  await contextoVisualAudio.resume();

  const analisador=contextoVisualAudio.createAnalyser();
  analisador.fftSize=512;
  analisador.smoothingTimeConstant=0.7;

  const fonte=contextoVisualAudio.createMediaStreamSource(fluxoAudio);
  fonte.connect(analisador);

  const dados=new Uint8Array(analisador.fftSize);
  const onda=indicadorAudio.querySelector(".ondaAudio");

  onda.innerHTML="";
  onda.style.width="100%";
  onda.style.overflow="hidden";
  onda.style.justifyContent="flex-start";
  onda.style.gap="2px";

  const barras=[];
  const alturas=Array(48).fill(3);

  for(let i=0;i<48;i++){
   const barra=document.createElement("span");
   barra.style.cssText="flex:1;min-width:2px;max-width:5px;height:3px;transition:height .08s linear";
   onda.appendChild(barra);
   barras.push(barra);
  }

  let ultimoTempo=0;

  function animar(tempo){
   analisador.getByteTimeDomainData(dados);

   let energia=0;

   for(let n=0;n<dados.length;n++){
    const valor=(dados[n]-128)/128;
    energia+=valor*valor;
   }

   const volume=Math.sqrt(energia/dados.length);

   if(tempo-ultimoTempo>45){
    ultimoTempo=tempo;

    let altura=3;

    if(volume>0.018){
     altura=4+Math.min(1,(volume-0.018)*12)*24;
    }

    alturas.shift();
    alturas.push(altura);

    barras.forEach((barra,i)=>{
     barra.style.height=alturas[i]+"px";
    });
   }

   quadroOndaAudio=requestAnimationFrame(animar);
  }

  animar(0);
 }catch(error){
  contextoVisualAudio=null;
 }
}
function pararOndaAudio(){
 if(quadroOndaAudio!==null){
  cancelAnimationFrame(quadroOndaAudio);
  quadroOndaAudio=null;
 }

 if(contextoVisualAudio){
  contextoVisualAudio.close().catch(()=>{});
  contextoVisualAudio=null;
 }

 indicadorAudio.querySelectorAll(".ondaAudio span").forEach(barra=>{
  barra.style.height="4px";
 });
}
function restaurarCompositorAudio(){
 campoTexto.classList.remove("oculto");
 botaoAudio.classList.remove("oculto");
 botaoAnexos.classList.remove("oculto");
 indicadorAudio.classList.add("oculto");
 botaoCancelarAudio.classList.add("oculto");
 botaoAudio.disabled=false;
 botaoCancelarAudio.disabled=false;
 botaoAudio.title="Gravar áudio";
 gravadorAudio=null;
}

botaoAudio.onclick=async()=>{
 if(gravadorAudio && gravadorAudio.state!=="inactive")return;

 try{
  if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==="undefined"){
   throw new Error("Seu navegador não permite gravar áudio.");
  }

  fluxoAudio=await navigator.mediaDevices.getUserMedia({
 audio:{
  noiseSuppression:true,
  echoCancellation:true,
  autoGainControl:true
 }
});
  iniciarOndaAudio();
  
  let tipoAudio="";

  if(MediaRecorder.isTypeSupported("audio/mp4")){
   tipoAudio="audio/mp4";
  }else if(MediaRecorder.isTypeSupported("audio/webm")){
   tipoAudio="audio/webm";
  }else{
   throw new Error("Formato de gravação não suportado.");
  }

  partesAudio=[];
  cancelarGravacaoAudio=false;

  gravadorAudio=new MediaRecorder(fluxoAudio,{mimeType:tipoAudio});
  
  gravadorAudio.ondataavailable=evento=>{
   if(evento.data.size>0)partesAudio.push(evento.data);
  };

  if(!campoTexto)throw new Error("Erro: campoTexto não encontrado.");
if(!botaoAudio)throw new Error("Erro: botão do microfone não encontrado.");
if(!botaoAnexos)throw new Error("Erro: botão de anexos não encontrado.");
if(!indicadorAudio)throw new Error("Erro: indicador de áudio não encontrado.");
if(!botaoCancelarAudio)throw new Error("Erro: botão cancelar não encontrado.");

campoTexto.classList.add("oculto");
botaoAudio.classList.add("oculto");
botaoAnexos.classList.add("oculto");
indicadorAudio.classList.remove("oculto");
botaoCancelarAudio.classList.remove("oculto");

  gravadorAudio.onstop=async()=>{
   const tipo=gravadorAudio.mimeType;
   const arquivo=new Blob(partesAudio,{type:tipo});

   fluxoAudio.getTracks().forEach(trilha=>trilha.stop());
   pararOndaAudio();
   if(cancelarGravacaoAudio){
    partesAudio=[];
    restaurarCompositorAudio();
    return;
   }

   try{
    if(arquivo.size>10*1024*1024){
     throw new Error("O áudio ultrapassou 10 MB.");
    }

    const extensao=tipo.includes("webm")?"webm":"m4a";
    const caminho=conversaId+"/"+usuarioAtual.id+"/"+Date.now()+"."+extensao;

    const {error:erroUpload}=await cliente.storage
     .from("mensagens")
     .upload(caminho,arquivo,{contentType:tipo});

    if(erroUpload)throw erroUpload;

    const {error:erroMensagem}=await cliente
     .from("messages")
     .insert({
      conversation_id:conversaId,
      sender_id:usuarioAtual.id,
      content:"PAPPI_AUDIO:"+caminho
     });

    if(erroMensagem)throw erroMensagem;

    await carregarMensagens(true);

   }catch(error){
    alert(error.message||"Não foi possível enviar o áudio.");
   }finally{
    partesAudio=[];
    restaurarCompositorAudio();
   }
  };
  
  gravadorAudio.start();
  
 }catch(error){
  if(fluxoAudio){
   fluxoAudio.getTracks().forEach(trilha=>trilha.stop());
  }
pararOndaAudio();
  restaurarCompositorAudio();
  alert(error.message||"Não foi possível iniciar a gravação.");
 }
};

 if(gravadorAudio && gravadorAudio.state==="recording"){
  cancelarGravacaoAudio=true;
  gravadorAudio.stop();
 }
};

  const senha=document.getElementById("novaSenha").value;
  const confirmar=document.getElementById("confirmarNovaSenha").value;
  const msg=document.getElementById("mensagemNovaSenha");
  const btn=document.getElementById("salvarNovaSenha");

  if(senha.length<6){msg.textContent="A senha precisa ter pelo menos 6 caracteres.";return;}
  if(senha!==confirmar){msg.textContent="As senhas não são iguais.";return;}

  btn.disabled=true;

  const {error}=await cliente.auth.updateUser({password:senha});

  if(error){
   msg.textContent="Não foi possível alterar a senha. Solicite outro link.";
   btn.disabled=false;
   btn.textContent="Salvar nova senha";
   return;
  }

  msg.textContent="Senha alterada com sucesso!";
  setTimeout(()=>direcionarUsuario(usuarioAtual),1200);
 };

  usuarioAtual=sessao?.user||null;
  mostrarTelaNovaSenha();

   setTimeout(()=>{if(telaAtual!=="perfil"&&telaAtual!=="principal")direcionarUsuario(sessao.user);},0);

 }else if(evento==="SIGNED_OUT"){
  mostrarEntrada();
 }
});

}
