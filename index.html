<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPPI - Sua conversa. Seu mundo.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #172b55;
       }
        /* FUNDO DA PAGINA PAPPI */
    .pagina {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .forma-azul {
      position: absolute;
      width: 230px;
      height: 230px;
      background: #1769e8;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
    }

    .forma-superior {
      top: -130px;
      right: -100px;
    }

    .forma-inferior {
      bottom: -140px;
      left: -100px;
    }
      /* IDENTIDADE VISUAL PAPPI */

    .conteudo-principal {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* LOGOTIPO PAPPI */

    .logo-pappi {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

        .simbolo-pappi {
  width: 180px;
  height: auto;
  display: block;
  overflow: visible;
}

        .ponto-logo {
      width: 15px;
      height: 15px;
      background: #0875ed;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    
    /* NOME DA MARCA */

    .nome-pappi {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 46px;
  font-weight: 900;
  letter-spacing: 2px;
  line-height: 1;
}

    .nome-azul {
      color: #172b55;
    }

    .nome-claro {
      color: #0875ed;
    }

    .slogan-pappi {
      font-size: 14px;
      color: #64748b;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* AREA DOS BOTOES */

    .area-botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 38px;
    }

    .botao-entrar {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #1769e8;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-cadastrar {
      width: 100%;
      height: 54px;
      border: 2px solid #1769e8;
      border-radius: 14px;
      background: #ffffff;
      color: #1769e8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="pagina">

  <div class="forma-azul forma-superior"></div>

  <div class="forma-azul forma-inferior"></div>
  <div class="conteudo-principal">

    <div class="logo-pappi">

      <svg class="simbolo-pappi" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="azul-pappi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0875ed"/>
      <stop offset="100%" stop-color="#172b8c"/>
    </linearGradient>
  </defs>

  <path d="M100 25 H260 Q335 25 335 100 V165 Q335 240 260 240 H145 L65 285 L85 225 Q25 200 25 145 V100 Q25 25 100 25 Z"
    fill="#ffffff"
    stroke="url(#azul-pappi)"
    stroke-width="25"
    stroke-linejoin="round"/>

  <circle cx="125" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="180" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="235" cy="145" r="23" fill="url(#azul-pappi)"/>
</svg>

      <div class="nome-pappi">
  <span class="nome-azul">PAP</span><span class="nome-claro">PI</span>
</div>

    </div>

    <div class="slogan-pappi">
      Sua conversa. Seu mundo.
    </div>
    <div class="area-botoes">

      <button class="botao-entrar">
        Entrar
      </button>

      <button class="botao-cadastrar">
        Criar minha conta
      </button>

    </div>
  </div>
</div>
</body>
</html>
