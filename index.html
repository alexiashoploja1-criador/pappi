<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPPI - Sua conversa. Seu mundo.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #172b55;
       }
        /* FUNDO DA PAGINA PAPPI */
    .pagina {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .forma-azul {
      position: absolute;
      width: 230px;
      height: 230px;
      background: #1769e8;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
    }

    .forma-superior {
      top: -130px;
      right: -100px;
    }

    .forma-inferior {
      bottom: -140px;
      left: -100px;
    }
      /* IDENTIDADE VISUAL PAPPI */

    .conteudo-principal {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* LOGOTIPO PAPPI */

    .logo-pappi {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

        .simbolo-pappi {
  width: 180px;
  height: auto;
  display: block;
  overflow: visible;
}

        .ponto-logo {
      width: 15px;
      height: 15px;
      background: #0875ed;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    
    /* NOME DA MARCA */

    .nome-pappi {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 52px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  line-height: 1;
}

    .nome-azul {
  color: #0875ed;
}

.nome-claro {
  color: #172b55;
}

    .slogan-pappi {
      font-size: 14px;
      color: #64748b;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .titulo-entrada {
  margin-top: 55px;
  font-size: 38px;
  font-weight: 900;
  color: #102653;
  text-align: center;
}

.descricao-entrada {
  margin-top: 18px;
  font-size: 19px;
  line-height: 1.5;
  color: #405779;
  text-align: center;
}
    .texto-legal {
  margin-top: 25px;
  max-width: 330px;
  font-size: 13px;
  line-height: 1.7;
  color: #64748b;
  text-align: center;
}
    /* AREA DOS BOTOES */

    .campo-email {
  width: 100%;
  height: 60px;
  margin-top: 30px;
  padding: 0 20px;
  border: 2px solid #dce5f1;
  border-radius: 15px;
  background: #ffffff;
  color: #172b55;
  font-size: 17px;
  outline: none;
}

.campo-email:focus {
  border-color: #0875ed;
}

.botao-continuar {
  width: 100%;
  height: 60px;
  margin-top: 16px;
  border: none;
  border-radius: 15px;
  background: #0875ed;
  color: #ffffff;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}
    .area-botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 38px;
    }

    .botao-entrar {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #1769e8;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-cadastrar {
      width: 100%;
      height: 54px;
      border: 2px solid #1769e8;
      border-radius: 14px;
      background: #ffffff;
      color: #1769e8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 480px) {

  .pagina {
    min-height: 100svh;
    padding: 8px 0;
  }

  .conteudo-principal {
    padding: 10px 22px;
  }

  .logo-pappi {
    gap: 5px;
    margin-bottom: 5px;
  }

  .simbolo-pappi {
    width: 115px;
  }

  .nome-pappi {
    font-size: 38px;
    letter-spacing: 1px;
  }

  .slogan-pappi {
    font-size: 12px;
    margin-top: 3px;
  }

  .titulo-entrada {
    margin-top: 16px;
    font-size: 27px;
  }

  .descricao-entrada {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.4;
  }

  .area-botoes {
    margin-top: 8px;
    gap: 8px;
  }

  .campo-email {
    height: 48px;
    margin-top: 12px;
    font-size: 15px;
  }

  .botao-continuar {
    height: 48px;
    margin-top: 4px;
    font-size: 16px;
  }

  .texto-legal {
    margin-top: 10px;
    font-size: 11px;
    line-height: 1.4;
  }
}
  </style>
</head>

<body>
<div class="pagina">

  <div class="forma-azul forma-superior"></div>

  <div class="forma-azul forma-inferior"></div>
  <div class="conteudo-principal">

    <div class="logo-pappi">

      <svg class="simbolo-pappi" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="azul-pappi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0875ed"/>
      <stop offset="100%" stop-color="#172b8c"/>
    </linearGradient>
  </defs>

  <path d="M105 25 C55 25 25 55 25 105 V150 C25 190 45 215 80 230 L65 285 L135 245 H255 C300 245 335 215 335 170 V100 C335 55 305 25 260 25 Z"
  fill="#ffffff"
  stroke="url(#azul-pappi)"
  stroke-width="25"
  stroke-linejoin="round"/>

  <circle cx="125" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="180" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="235" cy="145" r="23" fill="url(#azul-pappi)"/>
</svg>

      <div class="nome-pappi">
  <span class="nome-azul">PAP</span><span class="nome-claro">PI</span>
</div>

    </div>

    <div class="slogan-pappi">
      Sua conversa. Seu mundo.
    </div>
    <div class="titulo-entrada">
  Entre no PAPPI
</div>

<div class="descricao-entrada">
  Sua conexão com pessoas, grupos e comunidades em um só lugar.
</div>

<div class="area-botoes">

  <input
    class="campo-email"
    type="email"
    id="email"
    placeholder="Digite seu melhor e-mail"
    autocomplete="email"
  >

  <button class="botao-continuar" id="continuar">
    Continuar →
  </button>

</div>

<div class="texto-legal">
  Ao continuar, você concorda com nossos
  Termos de Uso e Política de Privacidade.
</div>
  </div>
</div>
</body>
</html>
