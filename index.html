<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAPPI - Sua conversa. Seu mundo.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;color:#172b55;background:#f4f7fc}
button,input{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.pagina{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff;position:relative;overflow:hidden}
.forma{position:absolute;width:230px;height:230px;border-radius:50%;background:#1769e8;opacity:.08}
.forma.a{top:-130px;right:-100px}
.forma.b{bottom:-140px;left:-100px}
.cartao{position:relative;z-index:1;width:100%;max-width:430px;padding:28px 24px;text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px}
.simbolo{width:125px;height:auto}
.nome-marca{font-family:"Arial Black",Arial,sans-serif;font-size:42px;font-weight:900;font-style:italic;letter-spacing:1px}
.azul{color:#0875ed}.marinho{color:#172b55}
.slogan{font-size:13px;color:#64748b;letter-spacing:.5px;margin-top:2px}
h1{font-size:29px;margin:25px 0 10px;color:#102653}
.descricao{font-size:15px;line-height:1.5;color:#526681;margin-bottom:22px}
.campo{width:100%;height:52px;padding:0 15px;border:1px solid #dce5f1;border-radius:12px;margin:7px 0;background:white;color:#172b55;outline:none}
.campo:focus{border:2px solid #0875ed}
.botao{width:100%;height:52px;border:0;border-radius:12px;background:#0875ed;color:white;font-weight:bold;margin-top:12px}
.botao:disabled{opacity:.6;cursor:wait}
.link{border:0;background:transparent;color:#0875ed;margin-top:17px;font-size:14px}
.mensagem{min-height:22px;margin-top:14px;font-size:14px;line-height:1.5;color:#0875ed}
.legal{font-size:11px;line-height:1.5;color:#7b899f;margin-top:18px}
.oculto{display:none!important}
.foto-area{margin:14px auto 18px}
.foto-preview{width:94px;height:94px;border-radius:50%;object-fit:cover;background:#eaf1fb;border:3px solid #dce8f8;display:block;margin:0 auto 10px}
.foto-label{display:inline-block;color:#0875ed;font-size:14px;cursor:pointer}
.app{min-height:100vh;background:#f4f7fc}
.cabecalho{height:70px;background:#fff;border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between;padding:0 5%}
.marca-pequena{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:900;font-style:italic}
.marca-pequena svg{width:40px;height:40px}
.sair{border:1px solid #0875ed;background:white;color:#0875ed;border-radius:9px;padding:9px 15px;font-weight:bold}
.layout{max-width:1150px;min-height:calc(100vh - 110px);margin:20px auto;padding:0 15px;display:grid;grid-template-columns:330px 1fr;gap:16px}
.lateral,.conversa{background:white;border:1px solid #e7edf6;border-radius:15px;overflow:hidden}
.lateral{padding:20px}
.lateral h2{font-size:22px;margin-bottom:15px}
.busca{width:100%;height:43px;border:1px solid #e1e8f2;background:#f7f9fd;border-radius:9px;padding:0 12px}
.nova{width:100%;height:43px;margin-top:12px;border:0;border-radius:9px;background:#0875ed;color:white;font-weight:bold}
.vazia{padding:30px 12px;text-align:center;color:#8190a8;font-size:14px;line-height:1.6}
.conversa{display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.boas-vindas{max-width:390px}
.avatar-principal{width:85px;height:85px;border-radius:50%;object-fit:cover;margin-bottom:15px;background:#eaf1fb}
.boas-vindas h2{font-size:24px;margin-bottom:10px}
.boas-vindas p{color:#7b899f;line-height:1.6;font-size:14px}
.dados-perfil{margin-top:18px;color:#0875ed;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
@media(max-width:650px){
 .cartao{padding:15px 18px}
 .simbolo{width:105px}
 .nome-marca{font-size:37px}
 h1{font-size:26px;margin-top:20px}
 .cabecalho{padding:0 15px}
 .layout{display:flex;flex-direction:column;height:auto;margin:12px auto}
 .lateral{min-height:220px}
 .conversa{min-height:330px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = "https://fvltrubujyvkbzijbobq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hXx1ZShKPY6iUiXtGJ9rUQ_HbuYGhQ2";
const cliente = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const URL_PAPPI = "https://alexiashoploja1-criador.github.io/pappi/";
const app = document.getElementById("app");

let telaAtual = "";
let usuarioAtual = null;
let fotoSelecionada = null;

const logo = `
<svg class="simbolo" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="azulPappi" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0875ed"/><stop offset="100%" stop-color="#172b8c"/>
</linearGradient></defs>
<path d="M105 25 C55 25 25 55 25 105 V150 C25 190 45 215 80 230 L65 285 L135 245 H255 C300 245 335 215 335 170 V100 C335 55 305 25 260 25 Z" fill="#fff" stroke="url(#azulPappi)" stroke-width="25" stroke-linejoin="round"/>
<circle cx="125" cy="145" r="23" fill="url(#azulPappi)"/>
<circle cx="180" cy="145" r="23" fill="url(#azulPappi)"/>
<circle cx="235" cy="145" r="23" fill="url(#azulPappi)"/>
</svg>`;

function mostrarEntrada(mensagemTexto="",cadastro=false){
 telaAtual="entrada";
 app.innerHTML=`
 <main class="pagina">
 <div class="forma a"></div><div class="forma b"></div>
 <section class="cartao">
 <div class="logo">${logo}
 <div class="nome-marca"><span class="azul">PAP</span><span class="marinho">PI</span></div>
 <div class="slogan">Sua conversa. Seu mundo.</div></div>
 <h1>${cadastro?"Crie sua conta":"Entre no PAPPI"}</h1>
 <p class="descricao">${cadastro?"Informe seu e-mail. Enviaremos um link para confirmar seu acesso.":"Sua conexão com pessoas, grupos e comunidades em um só lugar."}</p>
 <input class="campo" id="email" type="email" placeholder="Digite seu e-mail" autocomplete="email">
 ${cadastro?"":'<input class="campo" id="senha" type="password" placeholder="Sua senha" autocomplete="current-password">'}
 <button class="botao" id="acao">${cadastro?"Enviar link de confirmação →":"Entrar →"}</button>
 ${cadastro?"":'<button class="link" id="recuperar">Esqueci minha senha</button>'}
 <button class="link" id="alternar">${cadastro?"Já tem conta? Entrar":"Ainda não tem conta? Criar conta"}</button>
 <p class="mensagem" id="mensagem">${mensagemTexto}</p>
 <p class="legal">Ao continuar, você concorda com nossos Termos de Uso e Política de Privacidade.</p>
 </section></main>`;
 document.getElementById("alternar").onclick=()=>mostrarEntrada("",!cadastro);
 document.getElementById("acao").onclick=()=>cadastro?enviarLink():entrar();
 const recuperar=document.getElementById("recuperar");
 if(recuperar)recuperar.onclick=recuperarSenha;
}

async function recuperarSenha(){
 const email=document.getElementById("email").value.trim();
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("recuperar");

 if(!email){
  msg.textContent="Digite seu e-mail para recuperar a senha.";
  return;
 }

 btn.disabled=true;
 msg.textContent="Enviando link de recuperação...";

 const {error}=await cliente.auth.resetPasswordForEmail(email,{
  redirectTo:URL_PAPPI
 });

 btn.disabled=false;

 if(error){
  msg.textContent="Não foi possível enviar o link. Tente novamente.";
 }else{
  msg.textContent="Se o e-mail estiver cadastrado, enviaremos um link para redefinir sua senha. Verifique também o Spam.";
 }
} 
 function mensagemPerfil(txt,erro=false){
 const el=document.getElementById("mensagemPerfil");
 if(el){el.textContent=txt;el.style.color=erro?"#c0392b":"#0875ed";}
}

async function enviarLink(){
 const email=document.getElementById("email").value.trim();
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("acao");
 if(!email){msg.textContent="Digite seu e-mail.";return;}
 btn.disabled=true;btn.textContent="Enviando...";
 const {error}=await cliente.auth.signInWithOtp({
  email,
  options:{emailRedirectTo:URL_PAPPI,shouldCreateUser:true}
 });
 btn.disabled=false;btn.textContent="Enviar link de confirmação →";
 msg.textContent=error?"Não foi possível enviar: "+error.message:"Enviamos um link para seu e-mail. Abra a mensagem para continuar o cadastro.";
}

async function entrar(){
 const email=document.getElementById("email").value.trim();
 const senha=document.getElementById("senha").value;
 const msg=document.getElementById("mensagem");
 const btn=document.getElementById("acao");
 if(!email||!senha){msg.textContent="Informe seu e-mail e sua senha.";return;}
 btn.disabled=true;btn.textContent="Entrando...";
 const {data,error}=await cliente.auth.signInWithPassword({email,password:senha});
 btn.disabled=false;btn.textContent="Entrar →";
 if(error){msg.textContent="Não foi possível entrar: "+error.message;return;}
 await direcionarUsuario(data.user);
}

async function direcionarUsuario(usuario){
 if(!usuario)return;
 usuarioAtual=usuario;
 const {data,error}=await cliente.from("profiles").select("*").eq("user_id",usuario.id).maybeSingle();
 if(error){
  mostrarEntrada("Não foi possível consultar seu perfil: "+error.message);
  return;
 }
 if(data){abrirTelaPrincipal(usuario,data);}
 else{mostrarCompletarPerfil(usuario);}
}

function mostrarCompletarPerfil(usuario){
 telaAtual="perfil";
 fotoSelecionada=null;
 app.innerHTML=`
 <main class="pagina"><section class="cartao">
 <div class="logo">${logo}
 <div class="nome-marca"><span class="azul">PAP</span><span class="marinho">PI</span></div>
 <div class="slogan">Sua conversa. Seu mundo.</div></div>
 <h1>Complete seu perfil</h1>
 <p class="descricao">Agora escolha sua foto, seu nome, seu usuário e sua senha.</p>
 <div class="foto-area">
 <img id="fotoPreview" class="foto-preview" src="https://placehold.co/120x120/eaf1fb/0875ed?text=Foto" alt="Prévia da foto">
 <label class="foto-label" for="foto">Adicionar foto (opcional)</label>
 <input id="foto" class="oculto" type="file" accept="image/jpeg,image/png,image/webp">
 </div>
 <input class="campo" id="nomeCompleto" placeholder="Seu nome" autocomplete="name">
 <input class="campo" id="username" placeholder="Nome de usuário (ex.: alex123)" autocomplete="username">
 <input class="campo" id="senhaAtual" type="password" placeholder="Sua senha atual" autocomplete="current-password">
<input class="campo" id="senhaNova" type="password" placeholder="Crie sua nova senha (mínimo 6 caracteres)" autocomplete="new-password">
 <input class="campo" id="senhaConfirmar" type="password" placeholder="Confirme sua senha" autocomplete="new-password">
 <button class="botao" id="salvarPerfil">Salvar e entrar →</button>
 <p class="mensagem" id="mensagemPerfil"></p>
 </section></main>`;
 document.getElementById("foto").onchange=evento=>{
  const arquivo=evento.target.files[0];
  if(!arquivo)return;
  if(!["image/jpeg","image/png","image/webp"].includes(arquivo.type)){
   mensagemPerfil("Use uma imagem JPG, PNG ou WEBP.",true);return;
  }
  if(arquivo.size>2*1024*1024){
   mensagemPerfil("A foto deve ter no máximo 2 MB.",true);return;
  }
  fotoSelecionada=arquivo;
  document.getElementById("fotoPreview").src=URL.createObjectURL(arquivo);
 };
 document.getElementById("salvarPerfil").onclick=salvarPerfil;
}

async function salvarPerfil(){
 const nome=document.getElementById("nomeCompleto").value.trim();
 const username=document.getElementById("username").value.trim().toLowerCase();
 const senha=document.getElementById("senhaNova").value;
 const confirmar=document.getElementById("senhaConfirmar").value;
 const senhaAtual=document.getElementById("senhaAtual").value;
 const btn=document.getElementById("salvarPerfil");
 if(nome.length<2){mensagemPerfil("Informe seu nome completo.",true);return;}
 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  mensagemPerfil("O usuário deve ter de 3 a 20 caracteres: letras sem acento, números ou _.",true);return;
 }
 if(senha.length<6){mensagemPerfil("A senha precisa ter pelo menos 6 caracteres.",true);return;}
 if(senha!==confirmar){mensagemPerfil("As senhas não são iguais.",true);return;}
 btn.disabled=true;btn.textContent="Salvando...";
 let avatarUrl=null;
 try{
  const {data:authData,error:authError}=await cliente.auth.updateUser({
  password:senha,
  current_password:senhaAtual,
  data:{nome:nome,username:username}
});
  if(authError)throw authError;
  const usuario=authData.user||usuarioAtual;
  if(fotoSelecionada){
   const extensao=fotoSelecionada.type==="image/png"?"png":fotoSelecionada.type==="image/webp"?"webp":"jpg";
   const caminho=usuario.id+"/"+Date.now()+"."+extensao;
   const {error:uploadError}=await cliente.storage.from("fotos-perfil").upload(caminho,fotoSelecionada,{contentType:fotoSelecionada.type});
   if(uploadError)throw uploadError;
   const {data:urlData}=cliente.storage.from("fotos-perfil").getPublicUrl(caminho);
   avatarUrl=urlData.publicUrl;
  }
  const {error:insertError}=await cliente.from("profiles").insert({
   user_id:usuario.id,
   full_name:nome,
   username:username,
   avatar_url:avatarUrl
  });
  if(insertError){
   if(insertError.code==="23505")throw new Error("Esse nome de usuário já está em uso. Escolha outro.");
   throw insertError;
  }
  const {data:perfil}=await cliente.from("profiles").select("*").eq("user_id",usuario.id).single();
  abrirTelaPrincipal(usuario,perfil);
 }catch(error){
  mensagemPerfil(error.message||"Não foi possível salvar o perfil.",true);
  btn.disabled=false;btn.textContent="Salvar e entrar →";
 }
}
async function buscarUsuarios(){
 const termo=document.getElementById("buscaUsuarios").value.trim().replace(/^@/,"").toLowerCase();
 const resultados=document.getElementById("resultadosBusca");

 if(termo.length<3){
  resultados.innerHTML='<div class="vazia">Digite pelo menos 3 letras do usuário.</div>';
  return;
 }

 resultados.innerHTML='<div class="vazia">Buscando pessoas...</div>';

 const {data,error}=await cliente
  .from("profiles")
  .select("user_id,full_name,username,avatar_url")
  .ilike("username","%"+termo+"%")
  .neq("user_id",usuarioAtual.id)
  .limit(10);

 if(error){
  resultados.innerHTML='<div class="vazia">Não foi possível buscar usuários.</div>';
  return;
 }

 if(!data||data.length===0){
  resultados.innerHTML='<div class="vazia">Nenhum usuário encontrado.</div>';
  return;
 }

 resultados.innerHTML=data.map(p=>`
  <div class="vazia">
   <strong>${escapar(p.full_name)}</strong>
   <div>@${escapar(p.username)}</div>
   <button class="nova" data-user-id="${escapar(p.user_id)}">Conversar</button>
  </div>
 `).join("");

 resultados.querySelectorAll("button[data-user-id]").forEach(botao=>{
  botao.onclick=()=>iniciarConversa(botao.dataset.userId);
 });
}
async function iniciarConversa(outroUserId){
 const {data:minhas}=await cliente
  .from("conversation_members")
  .select("conversation_id")
  .eq("user_id",usuarioAtual.id);

 const ids=(minhas||[]).map(item=>item.conversation_id);
 let conversa=null;

 if(ids.length){
  const {data:existente}=await cliente
   .from("conversation_members")
   .select("conversation_id")
   .eq("user_id",outroUserId)
   .in("conversation_id",ids)
   .limit(1)
   .maybeSingle();

  if(existente) conversa=existente.conversation_id;
 }

 if(!conversa){
    const novoId=crypto.randomUUID();

  const {error}=await cliente
   .from("conversations")
   .insert({
    id:novoId,
    created_by:usuarioAtual.id
   });

  if(error){
   alert("Não foi possível criar a conversa: "+error.message);
   return;
  }

  conversa=novoId;

  const {error:erroMembros}=await cliente
   .from("conversation_members")
   .insert([
    {conversation_id:conversa,user_id:usuarioAtual.id},
    {conversation_id:conversa,user_id:outroUserId}
   ]);

  if(erroMembros){
   alert("Não foi possível adicionar os participantes.");
   return;
  }
 }

 const {data:perfil,error}=await cliente
  .from("profiles")
  .select("user_id,full_name,username,avatar_url")
  .eq("user_id",outroUserId)
  .single();

 if(error||!perfil){
  alert("Não foi possível carregar o perfil.");
  return;
 }

 abrirConversa(conversa,perfil);
}
 async function abrirConversa(conversaId,perfil){
 const area=document.querySelector(".conversa");

 if(!area)return;

 if(abrirConversa.canal){
  await cliente.removeChannel(abrirConversa.canal);
  abrirConversa.canal=null;
 }

 area.innerHTML=`
  <div style="height:100%;display:flex;flex-direction:column;padding:18px">
   <div style="display:flex;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid #e1e8f2">
    <button id="voltarConversas" class="nova" style="width:auto;margin:0;padding:0 15px">Voltar</button>
    <div>
     <strong>${escapar(perfil.full_name)}</strong>
     <div style="color:#8190a8;font-size:13px">@${escapar(perfil.username)}</div>
    </div>
   </div>

   <div id="listaMensagens" style="flex:1;overflow-y:auto;padding:15px 0">
    <div class="vazia">Carregando mensagens...</div>
   </div>

   <form id="formMensagem" style="display:flex;gap:8px;padding-top:12px;border-top:1px solid #e1e8f2">
    <input id="textoMensagem" class="busca" placeholder="Digite sua mensagem..." style="flex:1">
    <button class="nova" type="submit" style="width:auto;margin:0;padding:0 18px">Enviar</button>
   </form>
  </div>
 `;

 document.getElementById("voltarConversas").onclick=async()=>{
  const {data:meuPerfil}=await cliente
   .from("profiles")
   .select("*")
   .eq("user_id",usuarioAtual.id)
   .single();

  if(meuPerfil)abrirTelaPrincipal(usuarioAtual,meuPerfil);
 };

 async function carregarMensagens(){
  const {data,error}=await cliente
   .from("messages")
   .select("id,sender_id,content,created_at")
   .eq("conversation_id",conversaId)
   .order("created_at",{ascending:true});

  const lista=document.getElementById("listaMensagens");
  if(!lista)return;

  if(error){
   lista.innerHTML='<div class="vazia">Não foi possível carregar as mensagens.</div>';
   return;
  }
  await cliente.from("messages")
   .update({read_at:new Date().toISOString()})
   .eq("conversation_id",conversaId)
   .neq("sender_id",usuarioAtual.id)
   .is("read_at",null);

  await carregarConversas();
  if(!data||data.length===0){
   lista.innerHTML='<div class="vazia">Esta conversa ainda não tem mensagens. Envie a primeira!</div>';
   return;
  }

  lista.innerHTML=data.map(m=>{
   const minha=m.sender_id===usuarioAtual.id;
   return `<div style="display:flex;justify-content:${minha?"flex-end":"flex-start"};margin:8px 0">
    <div style="max-width:80%;padding:10px 14px;border-radius:12px;background:${minha?"#0875ed":"#edf2f8"};color:${minha?"white":"#243247"};overflow-wrap:anywhere">
     ${escapar(m.content)}
    </div>
   </div>`;
  }).join("");

  lista.scrollTop=lista.scrollHeight;
 }

 document.getElementById("formMensagem").onsubmit=async evento=>{
  evento.preventDefault();

  const campo=document.getElementById("textoMensagem");
  const texto=campo.value.trim();

  if(!texto)return;

  campo.disabled=true;

  const {error}=await cliente
   .from("messages")
   .insert({
    conversation_id:conversaId,
    sender_id:usuarioAtual.id,
    content:texto
   });

  campo.disabled=false;

  if(error){
   alert("Não foi possível enviar a mensagem.");
   return;
  }

  campo.value="";
  await carregarMensagens();
 };

 await carregarMensagens();

 abrirConversa.canal=cliente
  .channel("mensagens-"+conversaId)
  .on("postgres_changes",{
   event:"INSERT",
   schema:"public",
   table:"messages",
   filter:"conversation_id=eq."+conversaId
  },()=>carregarMensagens())
  .subscribe();
}
 async function carregarConversas(){
 const lista=document.getElementById("listaConversas");
 if(!lista)return;

 const {data:minhas,error}=await cliente
  .from("conversation_members")
  .select("conversation_id")
  .eq("user_id",usuarioAtual.id);

 if(error){
  lista.innerHTML='<div class="vazia">Não foi possível carregar as conversas.</div>';
  return;
 }
    
 if(!minhas||minhas.length===0){
  lista.innerHTML='<div class="vazia">Suas conversas aparecerão aqui.</div>';
  return;
 }

 const ids=minhas.map(item=>item.conversation_id);
 const {data:membros}=await cliente
  .from("conversation_members")
  .select("conversation_id,user_id")
  .in("conversation_id",ids)
  .neq("user_id",usuarioAtual.id);

 if(!membros||membros.length===0){
  lista.innerHTML='<div class="vazia">Nenhuma conversa encontrada.</div>';
  return;
 }

 const usuarios=[...new Set(membros.map(item=>item.user_id))];
 const {data:perfis}=await cliente
  .from("profiles")
  .select("user_id,full_name,username,avatar_url")
  .in("user_id",usuarios);

 if(!perfis||perfis.length===0){
  lista.innerHTML='<div class="vazia">Nenhum contato encontrado.</div>';
  return;
 }

  const {data:ultimas}=await cliente
  .from("messages")
  .select("conversation_id,content,created_at")
  .in("conversation_id",ids)
  .order("created_at",{ascending:false});
 const {data:naolidas}=await cliente
  .from("messages")
  .select("conversation_id")
  .in("conversation_id",ids)
  .neq("sender_id",usuarioAtual.id)
  .is("read_at",null);
  
 lista.innerHTML=membros.map(m=>{
  const p=perfis.find(x=>x.user_id===m.user_id);
  if(!p)return "";

  const ultima=(ultimas||[]).find(x=>x.conversation_id===m.conversation_id);
   const quantidadeNaoLidas=(naolidas||[])
   .filter(x=>x.conversation_id===m.conversation_id).length;
  const foto=p.avatar_url
   ? `<img src="${escapar(p.avatar_url)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`
   : `<div style="width:44px;height:44px;border-radius:50%;background:#e5efff;color:#0875ed;display:flex;align-items:center;justify-content:center;font-weight:bold">${escapar(p.full_name.charAt(0).toUpperCase())}</div>`;

  return `
   <button class="nova" data-conversa="${escapar(m.conversation_id)}" data-usuario="${escapar(p.user_id)}" style="display:flex;align-items:center;gap:10px;text-align:left;height:auto;padding:12px;margin:5px 0">
    ${foto}
    <span style="min-width:0;flex:1">
     <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
 <strong>${escapar(p.full_name)}</strong>
 ${quantidadeNaoLidas>0?`<span style="background:#0875ed;color:white;border-radius:20px;padding:2px 8px;font-size:11px">${quantidadeNaoLidas}</span>`:""}
</div>
     <div style="font-size:12px;font-weight:normal;opacity:.85">@${escapar(p.username)}</div>
     <div style="font-size:12px;font-weight:normal;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ultima?escapar(ultima.content):"Nenhuma mensagem ainda"}</div>
    </span>
   </button>
  `;
 }).join("");

 lista.querySelectorAll("button[data-conversa]").forEach(botao=>{
  botao.onclick=async()=>{
   const {data:perfil}=await cliente
    .from("profiles")

    .eq("user_id",botao.dataset.usuario)

   if(perfil)abrirConversa(botao.dataset.conversa,perfil);

}
 function editarMeuPerfil(usuario,perfil){
 let novaFoto=null;
 let removerFoto=false;

 app.insertAdjacentHTML("beforeend",`
 <div id="perfilModal" style="position:fixed;inset:0;background:#0008;z-index:999;display:flex;align-items:center;justify-content:center;padding:18px">
  <section style="background:white;width:100%;max-width:420px;padding:25px;border-radius:16px;max-height:90vh;overflow:auto">
   <h2 style="margin-bottom:18px">Meu perfil</h2>

   <div style="text-align:center;margin-bottom:18px">
    <img id="fotoPerfilEdicao" src="${perfil.avatar_url||""}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;background:#eaf1fb;${perfil.avatar_url?"":"display:none"}">
    <div id="semFotoPerfil" style="width:100px;height:100px;border-radius:50%;background:#eaf1fb;color:#0875ed;display:${perfil.avatar_url?"none":"inline-flex"};align-items:center;justify-content:center;font-size:38px;margin:auto">P</div>
   </div>

   <label class="foto-label" for="novaFotoPerfil">Alterar foto</label>
   <input id="novaFotoPerfil" type="file" accept="image/jpeg,image/png,image/webp" style="display:block;margin:10px 0">
   <button id="removerFotoPerfil" type="button" style="border:0;background:transparent;color:#d33;margin-bottom:15px">Remover foto atual</button>

   <input id="editarNome" class="campo" value="${escapar(perfil.full_name)}" placeholder="Nome completo">
   <input id="editarUsername" class="campo" value="${escapar(perfil.username)}" placeholder="Nome de usuário">

   <div id="mensagemEdicaoPerfil" style="font-size:14px;margin:10px 0;color:#d33"></div>
   <button id="salvarEdicaoPerfil" class="botao">Salvar alterações</button>
   <button id="cancelarEdicaoPerfil" class="link" style="width:100%">Cancelar</button>
  </section>
 </div>`);

 const modal=document.getElementById("perfilModal");
 const campoFoto=document.getElementById("novaFotoPerfil");
 const preview=document.getElementById("fotoPerfilEdicao");
 const semFoto=document.getElementById("semFotoPerfil");
 const mensagem=document.getElementById("mensagemEdicaoPerfil");

 campoFoto.onchange=()=>{
  const arquivo=campoFoto.files[0];
  if(!arquivo)return;

  if(!["image/jpeg","image/png","image/webp"].includes(arquivo.type)){
   mensagem.textContent="Use uma imagem JPG, PNG ou WEBP.";
   campoFoto.value="";
   return;
  }
  if(arquivo.size>2*1024*1024){
   mensagem.textContent="A foto deve ter no máximo 2 MB.";
   campoFoto.value="";
   return;
  }

  novaFoto=arquivo;
  removerFoto=false;
  preview.src=URL.createObjectURL(arquivo);
  preview.style.display="inline-block";
  semFoto.style.display="none";
  mensagem.textContent="";
 };

 document.getElementById("removerFotoPerfil").onclick=()=>{
  novaFoto=null;
  removerFoto=true;
  campoFoto.value="";
  preview.style.display="none";
  semFoto.style.display="inline-flex";
 };

 document.getElementById("cancelarEdicaoPerfil").onclick=()=>{
  modal.remove();
 };

 document.getElementById("salvarEdicaoPerfil").onclick=async()=>{
  const nome=document.getElementById("editarNome").value.trim();
  const username=document.getElementById("editarUsername").value.trim().toLowerCase();
  const botao=document.getElementById("salvarEdicaoPerfil");

  if(nome.length<2){
   mensagem.textContent="Informe seu nome completo.";
   return;
  }
  if(!/^[a-z0-9_]{3,20}$/.test(username)){
   mensagem.textContent="O usuário deve ter de 3 a 20 caracteres: letras sem acento, números ou _.";
   return;
  }

  botao.disabled=true;
  botao.textContent="Salvando...";

  try{
   let avatarUrl=removerFoto?null:perfil.avatar_url;

   if(novaFoto){
    const extensao=novaFoto.type==="image/png"?"png":novaFoto.type==="image/webp"?"webp":"jpg";
    const caminho=usuario.id+"/"+Date.now()+"."+extensao;
    const {error:uploadError}=await cliente.storage.from("fotos-perfil").upload(caminho,novaFoto,{contentType:novaFoto.type});
    if(uploadError)throw uploadError;

    const {data:urlData}=cliente.storage.from("fotos-perfil").getPublicUrl(caminho);
    avatarUrl=urlData.publicUrl;
   }

   const {error}=await cliente.from("profiles").update({
    full_name:nome,
    username:username,
    avatar_url:avatarUrl
   }).eq("user_id",usuario.id);

   if(error){
    if(error.code==="23505")throw new Error("Esse nome de usuário já está em uso.");
    throw error;
   }

   const {data:perfilAtualizado,error:erroBusca}=await cliente.from("profiles").select("*").eq("user_id",usuario.id).single();
   if(erroBusca)throw erroBusca;

   abrirTelaPrincipal(usuario,perfilAtualizado);

  }catch(error){
   mensagem.textContent=error.message||"Não foi possível salvar as alterações.";
   botao.disabled=false;
   botao.textContent="Salvar alterações";
  }
 };
}
function abrirTelaPrincipal(usuario,perfil){
 if(!usuario||!perfil)return;
 telaAtual="principal";
 usuarioAtual=usuario;
 const foto=perfil.avatar_url?`<img class="avatar-principal" src="${escapar(perfil.avatar_url)}" alt="Foto do perfil">`:`<div class="avatar-principal" style="display:inline-flex;align-items:center;justify-content:center;font-size:32px;color:#0875ed">P</div>`;
 app.innerHTML=`
 <main class="app">

</div>

<button class="nova" id="buscarUsuarios">Buscar pessoas</button>
<div id="resultadosBusca"></div>

</div>
 </aside>
 <section class="conversa">
 <div class="boas-vindas">
 ${foto}
 <h2>Bem-vindo(a), ${escapar(perfil.full_name)}!</h2>
 <p>Sua conta PAPPI está pronta. Em breve você poderá encontrar pessoas e começar suas conversas.</p>
 <div class="dados-perfil">@${escapar(perfil.username)}<br>${escapar(usuario.email||"")}</div>
 </div>
 </section>
 </section></main>`;
 document.getElementById("sair").onclick=async()=>{
  await cliente.auth.signOut();
  mostrarEntrada();
 };
 document.getElementById("editarPerfil").onclick=()=>abrirEditarPerfil(usuario,perfil);
 document.getElementById("buscarUsuarios").onclick=buscarUsuarios;
 carregarConversas();
   if(abrirTelaPrincipal.canalLista){
   cliente.removeChannel(abrirTelaPrincipal.canalLista);
  }

  abrirTelaPrincipal.canalLista=cliente
   .channel("lista-conversas-"+usuario.id)
   .on("postgres_changes",{
    event:"INSERT",
    schema:"public",
    table:"messages"
   },()=>{
    carregarConversas();
   })
   .subscribe();
 document.getElementById("nova").onclick=()=>{
  alert("A busca de usuários e as conversas serão implementadas na próxima etapa.");
 };
}

function escapar(valor){
 return String(valor||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

 function mostrarTelaNovaSenha(){
 telaAtual="recuperacao";
 app.innerHTML=`
 <main class="pagina">
 <section class="cartao">
 <div class="logo">${logo}
 <div class="nome-marca"><span class="azul">PAP</span><span class="marinho">PI</span></div>
 <div class="slogan">Sua conversa. Seu mundo.</div></div>
 <h1>Nova senha</h1>
 <p class="descricao">Crie uma nova senha para acessar sua conta PAPPI.</p>
 <input class="campo" id="novaSenha" type="password" placeholder="Nova senha (mínimo 6 caracteres)">
 <input class="campo" id="confirmarNovaSenha" type="password" placeholder="Confirme a nova senha">
 <button class="botao" id="salvarNovaSenha">Salvar nova senha</button>
 <p class="mensagem" id="mensagemNovaSenha"></p>
 </section>
 </main>`;

 document.getElementById("salvarNovaSenha").onclick=async()=>{
  const senha=document.getElementById("novaSenha").value;
  const confirmar=document.getElementById("confirmarNovaSenha").value;
  const msg=document.getElementById("mensagemNovaSenha");
  const btn=document.getElementById("salvarNovaSenha");

  if(senha.length<6){msg.textContent="A senha precisa ter pelo menos 6 caracteres.";return;}
  if(senha!==confirmar){msg.textContent="As senhas não são iguais.";return;}

  btn.disabled=true;
  btn.textContent="Salvando...";

  const {error}=await cliente.auth.updateUser({password:senha});

  if(error){
   msg.textContent="Não foi possível alterar a senha. Solicite outro link.";
   btn.disabled=false;
   btn.textContent="Salvar nova senha";
   return;
  }

  msg.textContent="Senha alterada com sucesso!";
  setTimeout(()=>direcionarUsuario(usuarioAtual),1200);
 };
}
cliente.auth.onAuthStateChange((evento,sessao)=>{
 if(evento==="PASSWORD_RECOVERY"){
  usuarioAtual=sessao?.user||null;
  mostrarTelaNovaSenha();
  return;
 }
 if(sessao&&sessao.user){
  if(telaAtual!=="perfil"&&telaAtual!=="principal"){
   setTimeout(()=>{if(telaAtual!=="perfil"&&telaAtual!=="principal")direcionarUsuario(sessao.user);},0);
  }
 }else if(evento==="SIGNED_OUT"){
  mostrarEntrada();
 }
});

async function iniciar(){
 mostrarEntrada();
 const {data,error}=await cliente.auth.getSession();
 if(!error&&data.session){
  await direcionarUsuario(data.session.user);
 }
}
iniciar();
</script>
