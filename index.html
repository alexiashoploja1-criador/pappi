<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPPI - Sua conversa. Seu mundo.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #172b55;
       }
        /* FUNDO DA PAGINA PAPPI */
    .pagina {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .forma-azul {
      position: absolute;
      width: 230px;
      height: 230px;
      background: #1769e8;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
    }

    .forma-superior {
      top: -130px;
      right: -100px;
    }

    .forma-inferior {
      bottom: -140px;
      left: -100px;
    }
      /* IDENTIDADE VISUAL PAPPI */

    .conteudo-principal {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* LOGOTIPO PAPPI */

    .logo-pappi {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

        .simbolo-pappi {
  width: 180px;
  height: auto;
  display: block;
  overflow: visible;
}

        .ponto-logo {
      width: 15px;
      height: 15px;
      background: #0875ed;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    
    /* NOME DA MARCA */

    .nome-pappi {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 52px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  line-height: 1;
}

    .nome-azul {
  color: #0875ed;
}

.nome-claro {
  color: #172b55;
}

    .slogan-pappi {
      font-size: 14px;
      color: #64748b;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .titulo-entrada {
  margin-top: 55px;
  font-size: 38px;
  font-weight: 900;
  color: #102653;
  text-align: center;
}

.descricao-entrada {
  margin-top: 18px;
  font-size: 19px;
  line-height: 1.5;
  color: #405779;
  text-align: center;
}
    .texto-legal {
  margin-top: 25px;
  max-width: 330px;
  font-size: 13px;
  line-height: 1.7;
  color: #64748b;
  text-align: center;
}
    /* AREA DOS BOTOES */

    .campo-email {
  width: 100%;
  height: 60px;
  margin-top: 30px;
  padding: 0 20px;
  border: 2px solid #dce5f1;
  border-radius: 15px;
  background: #ffffff;
  color: #172b55;
  font-size: 17px;
  outline: none;
}

.campo-email:focus {
  border-color: #0875ed;
}

.botao-continuar {
  width: 100%;
  height: 60px;
  margin-top: 16px;
  border: none;
  border-radius: 15px;
  background: #0875ed;
  color: #ffffff;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}
    .area-botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 38px;
    }

    .botao-entrar {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #1769e8;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-cadastrar {
      width: 100%;
      height: 54px;
      border: 2px solid #1769e8;
      border-radius: 14px;
      background: #ffffff;
      color: #1769e8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 480px) {

  .pagina {
    min-height: 100svh;
    padding: 8px 0;
  }

  .conteudo-principal {
    padding: 10px 22px;
  }

  .logo-pappi {
    gap: 5px;
    margin-bottom: 5px;
  }

  .simbolo-pappi {
    width: 115px;
  }

  .nome-pappi {
    font-size: 38px;
    letter-spacing: 1px;
  }

  .slogan-pappi {
    font-size: 12px;
    margin-top: 3px;
  }

  .titulo-entrada {
    margin-top: 16px;
    font-size: 27px;
  }

  .descricao-entrada {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.4;
  }

  .area-botoes {
    margin-top: 8px;
    gap: 8px;
  }

  .campo-email {
    height: 48px;
    margin-top: 12px;
    font-size: 15px;
  }

  .botao-continuar {
    height: 48px;
    margin-top: 4px;
    font-size: 16px;
  }

  .texto-legal {
    margin-top: 10px;
    font-size: 11px;
    line-height: 1.4;
  }
}
    .mensagem-pappi {
  min-height: 20px;
  margin-top: 12px;
  font-size: 14px;
  color: #0875ed;
  text-align: center;
}
  </style>
</head>

<body>
<div class="pagina">

  <div class="forma-azul forma-superior"></div>

  <div class="forma-azul forma-inferior"></div>
  <div class="conteudo-principal">

    <div class="logo-pappi">

      <svg class="simbolo-pappi" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="azul-pappi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0875ed"/>
      <stop offset="100%" stop-color="#172b8c"/>
    </linearGradient>
  </defs>

  <path d="M105 25 C55 25 25 55 25 105 V150 C25 190 45 215 80 230 L65 285 L135 245 H255 C300 245 335 215 335 170 V100 C335 55 305 25 260 25 Z"
  fill="#ffffff"
  stroke="url(#azul-pappi)"
  stroke-width="25"
  stroke-linejoin="round"/>

  <circle cx="125" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="180" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="235" cy="145" r="23" fill="url(#azul-pappi)"/>
</svg>

      <div class="nome-pappi">
  <span class="nome-azul">PAP</span><span class="nome-claro">PI</span>
</div>

    </div>

    <div class="slogan-pappi">
      Sua conversa. Seu mundo.
    </div>
    <div class="titulo-entrada">
  Entre no PAPPI
</div>

<div class="descricao-entrada">
  Sua conexão com pessoas, grupos e comunidades em um só lugar.
</div>

<div class="area-botoes">

  <input
    class="campo-email"
    type="email"
    id="email"
    placeholder="Digite seu melhor e-mail"
    autocomplete="email"
  >

  <button class="botao-continuar" id="continuar">
    Continuar →
  </button>

</div>
<p id="mensagem" class="mensagem-pappi"></p>
<div class="texto-legal">
  Ao continuar, você concorda com nossos
  Termos de Uso e Política de Privacidade.
</div>
  </div>
</div>
  

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://fvltrubujyvkbzijbobq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hXx1ZShKPY6iUiXtGJ9rUQ_HbuYGhQ2";

const cliente = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const botao = document.getElementById("continuar");
const campoEmail = document.getElementById("email");
const mensagem = document.getElementById("mensagem");

let telaPrincipalCriada = false;

function abrirTelaPrincipal(usuario) {
  if (telaPrincipalCriada) return;

  telaPrincipalCriada = true;
  document.querySelector(".pagina").style.display = "none";

  const estilo = document.createElement("style");
  estilo.textContent = `
    .app-pappi {
      min-height: 100vh;
      background: #f4f7fc;
      color: #172b55;
      font-family: Arial, sans-serif;
    }

    .app-cabecalho {
      height: 76px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      border-bottom: 1px solid #e8edf5;
    }

    .app-marca {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-marca svg {
      width: 42px;
      height: 42px;
    }

    .app-nome {
      font-size: 27px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
    }

    .app-nome span:first-child { color: #0875ed; }
    .app-nome span:last-child { color: #172b55; }

    .app-sair {
      background: white;
      color: #0875ed;
      border: 1px solid #0875ed;
      padding: 10px 17px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .app-layout {
      max-width: 1150px;
      min-height: 650px;
      height: calc(100vh - 110px);
      margin: 24px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
    }

    .app-lateral, .app-conversa {
      background: white;
      border: 1px solid #e7edf6;
      border-radius: 16px;
      overflow: hidden;
    }

    .app-lateral-topo {
      padding: 22px 20px 16px;
    }

    .app-lateral-topo h2 {
      font-size: 23px;
      margin-bottom: 17px;
    }

    .app-busca {
      width: 100%;
      height: 43px;
      border: 1px solid #e1e8f2;
      background: #f7f9fd;
      border-radius: 9px;
      padding: 0 13px;
      outline: none;
      font-size: 14px;
    }

    .app-nova {
      width: 100%;
      margin-top: 13px;
      height: 43px;
      border: none;
      border-radius: 9px;
      background: #0875ed;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .app-lista-vazia {
      padding: 35px 22px;
      text-align: center;
      color: #8190a8;
      font-size: 14px;
      line-height: 1.6;
    }

    .app-conversa {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }

    .app-boas-vindas {
      max-width: 380px;
    }

    .app-simbolo-grande {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
    }

    .app-boas-vindas h2 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .app-boas-vindas p {
      color: #7b899f;
      font-size: 15px;
      line-height: 1.6;
    }

    .app-usuario {
      margin-top: 25px;
      color: #0875ed;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .app-modal-fundo {
      position: fixed;
      inset: 0;
      background: #10234480;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .app-modal {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 16px;
      padding: 25px;
    }

    .app-modal h3 {
      margin-bottom: 12px;
      font-size: 21px;
    }

    .app-modal p {
      color: #718096;
      font-size: 14px;
      line-height: 1.5;
    }

    .app-modal-fechar {
      margin-top: 20px;
      width: 100%;
      height: 43px;
      border: none;
      border-radius: 9px;
      background: #0875ed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .app-cabecalho {
        height: 68px;
        padding: 0 17px;
      }

      .app-layout {
        height: auto;
        min-height: calc(100vh - 85px);
        margin: 12px auto;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .app-lateral {
        min-height: 250px;
      }

      .app-conversa {
        min-height: 330px;
      }

      .app-nome { font-size: 24px; }
    }
  `;
  document.head.appendChild(estilo);

  const principal = document.createElement("main");
  principal.id = "app-principal";
  principal.className = "app-pappi";

  principal.innerHTML = `
    <header class="app-cabecalho">
      <div class="app-marca">
        <svg viewBox="0 0 48 48" aria-label="Símbolo PAPPI">
          <path d="M10 4h27a8 8 0 0 1 8 8v17a8 8 0 0 1-8 8H23l-13 8v-8a8 8 0 0 1-8-8V12a8 8 0 0 1 8-8z"
            fill="#0875ed"/>
          <circle cx="15" cy="21" r="2.5" fill="white"/>
          <circle cx="24" cy="21" r="2.5" fill="white"/>
          <circle cx="33" cy="21" r="2.5" fill="white"/>
        </svg>
        <div class="app-nome"><span>PAP</span><span>PI</span></div>
      </div>
      <button class="app-sair" id="sair-pappi">Sair</button>
    </header>

    <div class="app-layout">
      <aside class="app-lateral">
        <div class="app-lateral-topo">
          <h2>Conversas</h2>
          <input
            class="app-busca"
            id="busca-pappi"
            type="search"
            placeholder="Buscar conversas..."
          >
          <button class="app-nova" id="nova-conversa">
            + Nova conversa
          </button>
        </div>
        <div class="app-lista-vazia" id="lista-conversas">
          Suas conversas aparecerão aqui.
          <br>
          Comece uma nova conversa com alguém.
        </div>
      </aside>

      <section class="app-conversa">
        <div class="app-boas-vindas">
          <svg class="app-simbolo-grande" viewBox="0 0 48 48">
            <path d="M10 4h27a8 8 0 0 1 8 8v17a8 8 0 0 1-8 8H23l-13 8v-8a8 8 0 0 1-8-8V12a8 8 0 0 1 8-8z"
              fill="#0875ed"/>
            <circle cx="15" cy="21" r="2.5" fill="white"/>
            <circle cx="24" cy="21" r="2.5" fill="white"/>
            <circle cx="33" cy="21" r="2.5" fill="white"/>
          </svg>
          <h2>Bem-vindo ao PAPPI</h2>
          <p>
            Sua conversa. Seu mundo.
            <br>
            Selecione uma conversa ou comece uma nova.
          </p>
          <div class="app-usuario" id="usuario-pappi"></div>
        </div>
      </section>
    </div>

    <div class="app-modal-fundo" id="modal-pappi">
      <div class="app-modal">
        <h3>Nova conversa</h3>
        <p>
          A busca de pessoas e a criação de conversas serão
          conectadas na próxima etapa.
        </p>
        <button class="app-modal-fechar" id="fechar-modal">
          Entendi
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(principal);

  document.getElementById("usuario-pappi").textContent =
    "Conectado como " + (usuario.email || "");

  document.getElementById("sair-pappi").addEventListener(
    "click",
    async function () {
      await cliente.auth.signOut();
    }
  );

  document.getElementById("nova-conversa").addEventListener(
    "click",
    function () {
      document.getElementById("modal-pappi").style.display = "flex";
    }
  );

  document.getElementById("fechar-modal").addEventListener(
    "click",
    function () {
      document.getElementById("modal-pappi").style.display = "none";
    }
  );
}

function voltarParaEntrada() {
  telaPrincipalCriada = false;

  const principal = document.getElementById("app-principal");
  if (principal) principal.remove();

  document.querySelector(".pagina").style.display = "";
}

botao.addEventListener("click", async function () {
  const email = campoEmail.value.trim();

  if (!email) {
    mensagem.textContent = "Digite seu e-mail.";
    return;
  }

  botao.disabled = true;
  mensagem.textContent = "Enviando link de acesso...";

  try {
    const { error } = await cliente.auth.signInWithOtp({
      email: email,
      options: {
        emailRedirectTo:
          "https://alexiashoploja1-criador.github.io/pappi/"
      }
    });

    if (error) {
      mensagem.textContent = error.message;
    } else {
      mensagem.textContent =
        "Verifique seu e-mail para entrar no PAPPI.";
    }
  } catch (erro) {
    mensagem.textContent =
      "Não foi possível enviar. Tente novamente.";
  } finally {
    botao.disabled = false;
  }
});

cliente.auth.onAuthStateChange(function (evento, sessao) {
  if (sessao && sessao.user) {
    abrirTelaPrincipal(sessao.user);
  } else if (evento === "SIGNED_OUT") {
    voltarParaEntrada();
  }
});

cliente.auth.getSession().then(function ({ data, error }) {
  if (!error && data.session) {
    abrirTelaPrincipal(data.session.user);
  }
});
</script>

</body>
</html>
