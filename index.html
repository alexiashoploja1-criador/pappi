<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPPI - Sua conversa. Seu mundo.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #172b55;
       }
        /* FUNDO DA PAGINA PAPPI */
    .pagina {
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .forma-azul {
      position: absolute;
      width: 230px;
      height: 230px;
      background: #1769e8;
      border-radius: 50%;
      opacity: 0.08;
      z-index: 0;
    }

    .forma-superior {
      top: -130px;
      right: -100px;
    }

    .forma-inferior {
      bottom: -140px;
      left: -100px;
    }
      /* IDENTIDADE VISUAL PAPPI */

    .conteudo-principal {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* LOGOTIPO PAPPI */

    .logo-pappi {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

        .simbolo-pappi {
  width: 180px;
  height: auto;
  display: block;
  overflow: visible;
}

        .ponto-logo {
      width: 15px;
      height: 15px;
      background: #0875ed;
      border-radius: 50%;
      position: relative;
      z-index: 2;
    }
    
    /* NOME DA MARCA */

    .nome-pappi {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 52px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  line-height: 1;
}

    .nome-azul {
  color: #0875ed;
}

.nome-claro {
  color: #172b55;
}

    .slogan-pappi {
      font-size: 14px;
      color: #64748b;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .titulo-entrada {
  margin-top: 55px;
  font-size: 38px;
  font-weight: 900;
  color: #102653;
  text-align: center;
}

.descricao-entrada {
  margin-top: 18px;
  font-size: 19px;
  line-height: 1.5;
  color: #405779;
  text-align: center;
}
    .texto-legal {
  margin-top: 25px;
  max-width: 330px;
  font-size: 13px;
  line-height: 1.7;
  color: #64748b;
  text-align: center;
}
    /* AREA DOS BOTOES */

    .campo-email {
  width: 100%;
  height: 60px;
  margin-top: 30px;
  padding: 0 20px;
  border: 2px solid #dce5f1;
  border-radius: 15px;
  background: #ffffff;
  color: #172b55;
  font-size: 17px;
  outline: none;
}

.campo-email:focus {
  border-color: #0875ed;
}

.botao-continuar {
  width: 100%;
  height: 60px;
  margin-top: 16px;
  border: none;
  border-radius: 15px;
  background: #0875ed;
  color: #ffffff;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
}
    .area-botoes {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 38px;
    }

    .botao-entrar {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 14px;
      background: #1769e8;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao-cadastrar {
      width: 100%;
      height: 54px;
      border: 2px solid #1769e8;
      border-radius: 14px;
      background: #ffffff;
      color: #1769e8;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    @media (max-width: 480px) {

  .pagina {
    min-height: 100svh;
    padding: 8px 0;
  }

  .conteudo-principal {
    padding: 10px 22px;
  }

  .logo-pappi {
    gap: 5px;
    margin-bottom: 5px;
  }

  .simbolo-pappi {
    width: 115px;
  }

  .nome-pappi {
    font-size: 38px;
    letter-spacing: 1px;
  }

  .slogan-pappi {
    font-size: 12px;
    margin-top: 3px;
  }

  .titulo-entrada {
    margin-top: 16px;
    font-size: 27px;
  }

  .descricao-entrada {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.4;
  }

  .area-botoes {
    margin-top: 8px;
    gap: 8px;
  }

  .campo-email {
    height: 48px;
    margin-top: 12px;
    font-size: 15px;
  }

  .botao-continuar {
    height: 48px;
    margin-top: 4px;
    font-size: 16px;
  }

  .texto-legal {
    margin-top: 10px;
    font-size: 11px;
    line-height: 1.4;
  }
}
    .mensagem-pappi {
  min-height: 20px;
  margin-top: 12px;
  font-size: 14px;
  color: #0875ed;
  text-align: center;
}
  </style>
</head>

<body>
<div class="pagina">

  <div class="forma-azul forma-superior"></div>

  <div class="forma-azul forma-inferior"></div>
  <div class="conteudo-principal">

    <div class="logo-pappi">

      <svg class="simbolo-pappi" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="azul-pappi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0875ed"/>
      <stop offset="100%" stop-color="#172b8c"/>
    </linearGradient>
  </defs>

  <path d="M105 25 C55 25 25 55 25 105 V150 C25 190 45 215 80 230 L65 285 L135 245 H255 C300 245 335 215 335 170 V100 C335 55 305 25 260 25 Z"
  fill="#ffffff"
  stroke="url(#azul-pappi)"
  stroke-width="25"
  stroke-linejoin="round"/>

  <circle cx="125" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="180" cy="145" r="23" fill="url(#azul-pappi)"/>
  <circle cx="235" cy="145" r="23" fill="url(#azul-pappi)"/>
</svg>

      <div class="nome-pappi">
  <span class="nome-azul">PAP</span><span class="nome-claro">PI</span>
</div>

    </div>

    <div class="slogan-pappi">
      Sua conversa. Seu mundo.
    </div>
    <div class="titulo-entrada">
  Entre no PAPPI
</div>

<div class="descricao-entrada">
  Sua conexão com pessoas, grupos e comunidades em um só lugar.
</div>

<div class="area-botoes">

  <input
    class="campo-email"
    type="email"
    id="email"
    placeholder="Digite seu melhor e-mail"
    autocomplete="email"
  >

  <button class="botao-continuar" id="continuar">
    Continuar →
  </button>

</div>
<p id="mensagem" class="mensagem-pappi"></p>
<div class="texto-legal">
  Ao continuar, você concorda com nossos
  Termos de Uso e Política de Privacidade.
</div>
  </div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://fvltrubujyvkbzijbobq.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_hXx1ZShKPY6iUiXtGJ9rUQ_HbuYGhQ2";

  const cliente = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const botao = document.getElementById("continuar");
  const campoEmail = document.getElementById("email");
  const mensagem = document.getElementById("mensagem");

  let telaPrincipalCriada = false;

  function abrirTelaPrincipal(usuario) {
    if (telaPrincipalCriada) return;

    telaPrincipalCriada = true;

    document.querySelector(".pagina").style.display = "none";

    const estilo = document.createElement("style");
    estilo.textContent = `
      .pappi-principal {
        min-height: 100vh;
        background: #f5f8ff;
        font-family: Arial, sans-serif;
      }
      .pappi-topo {
        background: white;
        padding: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 10px #0000000d;
      }
      .pappi-marca {
        font-size: 27px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 1px;
      }
      .pappi-marca span:first-child {
        color: #0875ed;
      }
      .pappi-marca span:last-child {
        color: #172b55;
      }
      .pappi-conteudo {
        max-width: 700px;
        margin: 35px auto;
        padding: 20px;
      }
      .pappi-painel {
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 4px 20px #0000000a;
      }
      .pappi-sair {
        border: none;
        background: #0875ed;
        color: white;
        padding: 11px 17px;
        border-radius: 9px;
        font-size: 14px;
      }
    `;
    document.head.appendChild(estilo);

    const principal = document.createElement("main");
    principal.id = "app-principal";
    principal.className = "pappi-principal";

    principal.innerHTML = `
      <header class="pappi-topo">
        <div class="pappi-marca">
          <span>PAP</span><span>PI</span>
        </div>
        <button class="pappi-sair" id="sair-pappi">
          Sair
        </button>
      </header>

      <section class="pappi-conteudo">
        <div class="pappi-painel">
          <h2>Bem-vindo ao PAPPI</h2>
          <p id="usuario-pappi"></p>
          <hr style="margin:20px 0; opacity:.15">
          <h3>Conversas</h3>
          <p style="margin-top:12px;color:#718096">
            Sua área de conversas está pronta para ser desenvolvida.
          </p>
        </div>
      </section>
    `;

    document.body.appendChild(principal);

    document.getElementById("usuario-pappi").textContent =
      usuario.email || "";

    document.getElementById("sair-pappi").addEventListener(
      "click",
      async function () {
        await cliente.auth.signOut();
      }
    );
  }

  function voltarParaEntrada() {
    telaPrincipalCriada = false;

    const principal = document.getElementById("app-principal");
    if (principal) principal.remove();

    document.querySelector(".pagina").style.display = "";
  }

  botao.addEventListener("click", async function () {
    const email = campoEmail.value.trim();

    if (!email) {
      mensagem.textContent = "Digite seu e-mail.";
      return;
    }

    botao.disabled = true;
    mensagem.textContent = "Enviando link de acesso...";

    try {
      const { error } = await cliente.auth.signInWithOtp({
        email: email,
        options: {
          emailRedirectTo:
            "https://alexiashoploja1-criador.github.io/pappi/"
        }
      });

      if (error) {
        mensagem.textContent = error.message;
      } else {
        mensagem.textContent =
          "Verifique seu e-mail para entrar no PAPPI.";
      }
    } catch (erro) {
      mensagem.textContent =
        "Não foi possível enviar. Tente novamente.";
    } finally {
      botao.disabled = false;
    }
  });

  cliente.auth.onAuthStateChange(function (evento, sessao) {
    if (sessao && sessao.user) {
      abrirTelaPrincipal(sessao.user);
    } else if (evento === "SIGNED_OUT") {
      voltarParaEntrada();
    }
  });

  cliente.auth.getSession().then(function ({ data, error }) {
    if (!error && data.session) {
      abrirTelaPrincipal(data.session.user);
    }
  });
</script>

</body>
</html>
